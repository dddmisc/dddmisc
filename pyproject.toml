[project]
name = "dddmisc"
version = "0.1.0"
description = ""
authors = [
    {name = "Vladislav Vorobyov", email = "vladislav.vorobyov@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tenacity==8.0.0",
    "pydantic==2.1.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "test",
]
pythonpath = [
    "bases",
    "components",
]
filterwarnings = [
    'ignore::DeprecationWarning:pytest_asyncio',
]

[tool.mypy]
mypy_path = [
    "components",
    "bases"
]
packages = ["d3m"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true

[tool.coverage.paths]
source = [
    "bases/dddmisc",
    'components/dddmisc'
]
[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = true
skip_empty = true
ignore_errors = true
exclude_lines = [
    "@abc.abstractmethod",
    "@t.overload",
    "Protocol",
    "def __hash__",
    "pragma: no cover",
    "raise NotImplementedError"
]
