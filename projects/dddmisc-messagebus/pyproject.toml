[project]
name = "dddmisc-messagebus"
version = "0.7.0"
description = "This package provides the implementation messagebus"
authors = [
    {name = "Vladislav Vorobyov", email = "vladislav.vorobyov@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dddmisc-core~=0.7.0",
]

[project.urls]
Homepage = "https://dddmisc.github.io/dddmisc-docs/"
Repository = "https://github.com/dddmisc/dddmisc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../bases/d3m/messagebus" = "d3m/messagebus"
