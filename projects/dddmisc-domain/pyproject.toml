[project]
name = "dddmisc-domain"
version = "0.6.1"
description = "This package provides implementation domain's objects classes"
authors = [
    {name = "Vladislav Vorobyov", email = "vladislav.vorobyov@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dddmisc-core~=0.7.0",
    "pydantic>=2.1.0",
]

[project.urls]
Homepage = "https://dddmisc.github.io/dddmisc-docs/"
Repository = "https://github.com/dddmisc/dddmisc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../bases/d3m/domain" = "d3m/domain"
