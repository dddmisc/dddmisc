[project]
name = "dddmisc-core"
version = "0.7.1"
description = "This package provides the core interfaces and types for dddmisc packages family"
authors = [
    {name = "Vladislav Vorobyov", email = "vladislav.vorobyov@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.1.0",
]

[project.urls]
Homepage = "https://dddmisc.github.io/dddmisc-docs/"
Repository = "https://github.com/dddmisc/dddmisc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../bases/d3m/core" = "d3m/core"
