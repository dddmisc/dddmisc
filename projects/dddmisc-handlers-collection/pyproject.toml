[project]
name = "dddmisc-handlers-collection"
version = "0.6.0"
description = "This package provides implementation a collection of command's and event's handlers"
authors = [
    {name = "Vladislav Vorobyov", email = "vladislav.vorobyov@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dddmisc-core~=0.7.0",
    "tenacity>=8.0.0",
]

[project.urls]
Homepage = "https://dddmisc.github.io/dddmisc-docs/"
Repository = "https://github.com/dddmisc/dddmisc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../bases/d3m/hc" = "d3m/hc"
