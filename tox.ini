[tox]
requires =
    tox>=4
    tox-uv
env_list = type,py{310,311,312}

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    dev
commands =
    pytest {posargs: --cov=d3m test}

[testenv:type]
runner = uv-venv-lock-runner
dependency_groups =
    dev
commands =
    mypy --check-untyped-defs
